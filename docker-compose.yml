# docker compose up -d --build   ->   http://localhost:8102
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_NAME: Helpdesk
      APP_URL: ${APP_URL:-http://localhost:8102}
      APP_KEY: ${APP_KEY:-}
      APP_DEMO: ${APP_DEMO:-true}
      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: pt_BR
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    ports:
      - "${WEB_PORT:-8102}:80"
    volumes:
      - storage:/app/storage

volumes:
  storage:
